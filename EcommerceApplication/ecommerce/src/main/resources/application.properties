spring.application.name=ecommerce

spring.datasource.name=ecommerce
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?serverTimezone=UTC
spring.datasource.username=root
#spring.datasource.password=root
server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# logging.level.root=ERROR
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.springframework.security=DEBUG
# logging.level.web=DEBUG
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=false

# logging.level.org.springframework.transaction=DEBUG
# logging.level.org.hibernate=DEBUG

# Set root logging to ERROR to suppress most logs
logging.level.root=ERROR

# Keep only Spring Security logs
logging.level.org.springframework.security=OFF

# Completely disable Hibernate logs
logging.level.org.hibernate=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Disable transaction and web logs
logging.level.org.springframework.transaction=ERROR
logging.level.web=ERROR

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false




